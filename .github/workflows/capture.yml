name: capture

# Fas 0-daemonen. Målet är ett snapshot var 15:e minut — streckprocenten rör
# sig mest sista dygnet före spelstopp, och de rörelserna går inte att hämta
# i efterhand.
#
# GitHub Actions stryper schemalagda cron hårt: en '*/15'-cron gav i praktiken
# ~8 körningar/dygn med luckor på upp till 12 h (mätt 26 aug–10 sep 2026).
# Därför kör varje jobb en egen loop i knappt 6 h (jobbets maxtid), och cron
# triggar varje timme. Concurrency-gruppen köar nästa jobb tills det pågående
# är klart, så det tar vid direkt. Enstaka strypta triggers spelar då ingen
# roll — det räcker att en av dem per 6 h går igenom.
# Kräver publikt repo: loopen förbrukar ~43 000 Actions-minuter/månad, privata
# repon har 2 000 gratis. Publika har obegränsat. (Slog i taket 2026-09-14.)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Capture var 15:e minut i ~5 h 45 min, sedan avslutas jobbet snyggt
      # innan timeouten. fetch-results ligger i loopen: idempotent och billig,
      # och utan den får live-capturade omgångar aldrig facit.
      - name: Capture-loop
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            npm run capture || echo "::warning::capture misslyckades, försöker igen om 15 min"
            npm run fetch-results || echo "::warning::fetch-results misslyckades"
            sleep 900
          done
