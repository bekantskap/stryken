name: capture

# Fas 0-daemonen. Var 15:e minut — streckprocenten rör sig mest sista dygnet
# före spelstopp, och de rörelserna går inte att hämta i efterhand.
#
# Vercels free tier tillåter bara cron 1×/dygn med lös precision, därför ligger
# capture här. GitHub Actions är gratis för publika repon och räknar 15-min-cron
# utan problem.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # Hoppa aldrig över en körning för att den föregående hänger, men kör inte
  # heller två samtidigt mot samma databas.
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Kör capture
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run capture

      # Hämtar facit för omgångar som avgjorts. Utan detta får live-capturade
      # omgångar aldrig något facit, och historikloggen (F5) slutar fungera
      # framåt — upptäcktes när 4968 saknade facit trots att den avgjorts.
      # Idempotent och billig: hoppar över omgångar som redan har facit.
      - name: Hämta facit för avgjorda omgångar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch-results
